html,body{height:100%}
body{

.wrap{min-height:100%; display:flex; justify-content:center; align-items:flex-start}

.tag{margin:0 0 26px; max-width:34ch; color:rgba(241,236,223,.82); font-size:15.5px}
.actions{display:grid; gap:10px}
.btn{

  font:inherit; font-weight:600; font-size:16px; padding:15px 18px; border-radius:10px;

.btn.primary{background:var(--brass); color:var(--green)}
.btn.primary:hover{background:#d4b36e}
.btn.ghost{background:transparent; color:var(--bone)}
.btn.ghost:hover{background:var(--green-2)}
:focus-visible{outline:2px solid var(--brass); outline-offset:3px}
.panel :focus-visible{outline-color:var(--ink)}

/* contatos */

.rows{list-style:none; margin:0; padding:0}
.rows li{border-bottom:1px solid var(--rule)}

.qr{display:grid; grid-template-columns:132px 1fr; gap:18px; align-items:center; margin-top:26px}
